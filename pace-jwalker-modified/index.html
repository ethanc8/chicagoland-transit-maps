<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pace Frequency Maps</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  display: flex;
  flex-direction: column;
  height: 100vh;
  font-family: system-ui, -apple-system, sans-serif;
  background: #111827;
  color: #d1d5db;
  overflow: hidden;
}

header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  background: #1f2937;
  border-bottom: 1px solid #374151;
  flex-wrap: wrap;
  flex-shrink: 0;
}

h1 {
  font-size: 0.9rem;
  font-weight: 700;
  color: #f9fafb;
  letter-spacing: 0.02em;
  white-space: nowrap;
  margin-right: 4px;
}

.divider {
  width: 1px;
  height: 22px;
  background: #374151;
  flex-shrink: 0;
}

.group-label {
  font-size: 0.65rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #6b7280;
  white-space: nowrap;
  align-self: center;
}

.map-buttons {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  align-items: center;
}

.map-btn {
  padding: 4px 11px;
  border: 1px solid #374151;
  background: #374151;
  color: #9ca3af;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.78rem;
  font-family: inherit;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
  white-space: nowrap;
}
.map-btn:hover { background: #4b5563; color: #f3f4f6; border-color: #6b7280; }
.map-btn.active { background: #2563eb; border-color: #3b82f6; color: #fff; }

.zoom-controls {
  margin-left: auto;
  display: flex;
  gap: 4px;
  align-items: center;
  flex-shrink: 0;
}

.ctrl-btn {
  height: 26px;
  min-width: 26px;
  padding: 0 7px;
  border: 1px solid #374151;
  background: #374151;
  color: #9ca3af;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.85rem;
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.12s, color 0.12s;
}
.ctrl-btn:hover { background: #4b5563; color: #f3f4f6; }

#scale-label {
  font-size: 0.72rem;
  color: #6b7280;
  min-width: 38px;
  text-align: right;
}

#viewport {
  flex: 1;
  overflow: hidden;
  position: relative;
  cursor: grab;
  background: #030712;
  touch-action: none;
}
#viewport.dragging { cursor: grabbing; }

#map-img {
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: 0 0;
  user-select: none;
  -webkit-user-drag: none;
  max-width: none;
  display: block;
}

#loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #4b5563;
  font-size: 0.85rem;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
}
#loading.visible { opacity: 1; }

#hint {
  position: absolute;
  bottom: 10px;
  right: 12px;
  font-size: 0.68rem;
  color: #374151;
  pointer-events: none;
  line-height: 1.6;
  text-align: right;
}
</style>
</head>
<body>

<header>
  <h1>Pace Frequency Maps</h1>

  <div class="divider"></div>
  <span class="group-label">Timeline</span>
  <div class="map-buttons" id="timeline-btns"></div>

  <div class="divider"></div>
  <span class="group-label">Revision</span>
  <div class="map-buttons" id="revision-btns"></div>

  <div class="divider"></div>
  <div class="zoom-controls">
    <button class="ctrl-btn" id="btn-zoom-in" title="Zoom in (+ key)">+</button>
    <button class="ctrl-btn" id="btn-zoom-out" title="Zoom out (− key)">−</button>
    <button class="ctrl-btn" id="btn-zoom-100" title="Zoom to 100%" style="font-size:0.7rem;padding:0 8px;">100%</button>
    <button class="ctrl-btn" id="btn-reset" title="Fit to screen (0 key)" style="font-size:0.7rem;padding:0 8px;">Fit</button>
    <span id="scale-label">100%</span>
  </div>
</header>

<div id="viewport">
  <img id="map-img" src="" alt="Transit map" draggable="false">
  <div id="loading">Loading…</div>
  <div id="hint">
    Scroll to zoom · Drag to pan<br>
    Keys: +/− zoom · 0 fit · 1–8 switch map
  </div>
</div>

<script>
const TIMELINE = [
  { file: 'spring-2024.png', label: 'Spring 2024' },
  { file: '2025-12-07.png',  label: 'Dec 2025'    },
  { file: '2026-03-15.png',  label: 'Mar 2026'    },
  { file: '2026-06-01.png',  label: 'Jun 2026'    },
  { file: 'latest.png',      label: 'Latest'      },
];
const REVISION = [
  { file: 'revision-coverage.png',  label: 'Coverage'  },
  { file: 'revision-plus10.png',    label: '+10'        },
  { file: 'revision-ridership.png', label: 'Ridership'  },
];
const ALL_MAPS = [...TIMELINE, ...REVISION];

const viewport   = document.getElementById('viewport');
const img        = document.getElementById('map-img');
const loading    = document.getElementById('loading');
const scaleLabel = document.getElementById('scale-label');

let scale = 1, panX = 0, panY = 0;
let imgW = 0, imgH = 0;
let needFit = true;
let activeIndex = 0;
let allButtons = [];

// ── Transform ─────────────────────────────────────────────────────────────────

function applyTransform() {
  img.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
  scaleLabel.textContent = Math.round(scale * 100) + '%';
}

function fitToView() {
  if (!imgW || !imgH) return;
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  scale = Math.min(vw / imgW, vh / imgH);
  panX  = (vw - imgW * scale) / 2;
  panY  = (vh - imgH * scale) / 2;
  applyTransform();
}

function zoomAt(factor, cx, cy) {
  const newScale = Math.max(0.05, Math.min(32, scale * factor));
  const imgX = (cx - panX) / scale;
  const imgY = (cy - panY) / scale;
  scale = newScale;
  panX  = cx - imgX * scale;
  panY  = cy - imgY * scale;
  applyTransform();
}

// ── Map switching ──────────────────────────────────────────────────────────────

function loadMap(index, keepTransform = true) {
  if (index < 0 || index >= ALL_MAPS.length) return;
  activeIndex = index;
  allButtons.forEach((b, i) => b.classList.toggle('active', i === index));
  if (!keepTransform) needFit = true;
  loading.classList.add('visible');
  img.src = ALL_MAPS[index].file;
}

img.addEventListener('load', () => {
  loading.classList.remove('visible');
  imgW = img.naturalWidth;
  imgH = img.naturalHeight;
  if (needFit) { fitToView(); needFit = false; }
});

img.addEventListener('error', () => loading.classList.remove('visible'));

// ── Build buttons ──────────────────────────────────────────────────────────────

function makeButtons(maps, startIndex, containerId) {
  const container = document.getElementById(containerId);
  maps.forEach((m, i) => {
    const globalIndex = startIndex + i;
    const btn = document.createElement('button');
    btn.className = 'map-btn';
    btn.textContent = m.label;
    btn.title = `Switch to ${m.label} (key ${globalIndex + 1})`;
    btn.addEventListener('click', () => loadMap(globalIndex, true));
    container.appendChild(btn);
    allButtons.push(btn);
  });
}

makeButtons(TIMELINE, 0,              'timeline-btns');
makeButtons(REVISION, TIMELINE.length, 'revision-btns');

// ── Zoom buttons ───────────────────────────────────────────────────────────────

const vcx = () => viewport.clientWidth  / 2;
const vcy = () => viewport.clientHeight / 2;

document.getElementById('btn-zoom-in') .addEventListener('click', () => zoomAt(1.3,     vcx(), vcy()));
document.getElementById('btn-zoom-out').addEventListener('click', () => zoomAt(1 / 1.3, vcx(), vcy()));
document.getElementById('btn-zoom-100').addEventListener('click', () => {
  const cx = vcx(), cy = vcy();
  const imgX = (cx - panX) / scale;
  const imgY = (cy - panY) / scale;
  scale = 1;
  panX = cx - imgX;
  panY = cy - imgY;
  applyTransform();
});
document.getElementById('btn-reset')   .addEventListener('click', fitToView);

// ── Scroll zoom ────────────────────────────────────────────────────────────────

viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  zoomAt(factor, e.clientX - rect.left, e.clientY - rect.top);
}, { passive: false });

// ── Pointer drag + pinch zoom (mouse, touch, stylus) ──────────────────────────

const pointers = new Map(); // pointerId → {x, y}
let dragStart  = null;      // {x, y, panX, panY}
let pinchStart = null;      // {mid, dist, panX, panY, scale}

function pinchMid()  {
  const [a, b] = [...pointers.values()];
  return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
}
function pinchDist() {
  const [a, b] = [...pointers.values()];
  return Math.hypot(a.x - b.x, a.y - b.y);
}

viewport.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  viewport.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 1) {
    dragStart  = { x: e.clientX, y: e.clientY, panX, panY };
    pinchStart = null;
    viewport.classList.add('dragging');
  } else if (pointers.size === 2) {
    pinchStart = { mid: pinchMid(), dist: pinchDist(), panX, panY, scale };
    dragStart  = null;
  }
});

viewport.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 1 && dragStart) {
    panX = dragStart.panX + (e.clientX - dragStart.x);
    panY = dragStart.panY + (e.clientY - dragStart.y);
    applyTransform();
  } else if (pointers.size === 2 && pinchStart) {
    const rect     = viewport.getBoundingClientRect();
    const currDist = pinchDist();
    const currMid  = pinchMid();
    const newScale = Math.max(0.05, Math.min(32, pinchStart.scale * (currDist / pinchStart.dist)));

    // Keep pinch midpoint anchored to the same image coordinate
    const cx   = pinchStart.mid.x - rect.left;
    const cy   = pinchStart.mid.y - rect.top;
    const imgX = (cx - pinchStart.panX) / pinchStart.scale;
    const imgY = (cy - pinchStart.panY) / pinchStart.scale;

    scale = newScale;
    panX  = (currMid.x - rect.left) - imgX * scale;
    panY  = (currMid.y - rect.top)  - imgY * scale;
    applyTransform();
  }
});

function onPointerEnd(e) {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    dragStart = null; pinchStart = null;
    viewport.classList.remove('dragging');
  } else if (pointers.size === 1) {
    // One finger lifted during pinch — resume single-finger drag
    const [, pos] = [...pointers.entries()][0];
    dragStart  = { x: pos.x, y: pos.y, panX, panY };
    pinchStart = null;
  }
}

viewport.addEventListener('pointerup',     onPointerEnd);
viewport.addEventListener('pointercancel', onPointerEnd);

// ── Keyboard shortcuts ─────────────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  switch (e.key) {
    case '+': case '=': zoomAt(1.2, vcx(), vcy()); break;
    case '-': case '_': zoomAt(1/1.2, vcx(), vcy()); break;
    case '0':           fitToView(); break;
    case 'ArrowLeft':   panX -= 60; applyTransform(); break;
    case 'ArrowRight':  panX += 60; applyTransform(); break;
    case 'ArrowUp':     panY -= 60; applyTransform(); break;
    case 'ArrowDown':   panY += 60; applyTransform(); break;
    default:
      const n = parseInt(e.key);
      if (n >= 1 && n <= ALL_MAPS.length) loadMap(n - 1, true);
  }
});

// ── Window resize ──────────────────────────────────────────────────────────────

window.addEventListener('resize', () => { if (needFit) fitToView(); });

// ── Initial load ───────────────────────────────────────────────────────────────

loadMap(4, false); // "Latest" as default
</script>
</body>
</html>
